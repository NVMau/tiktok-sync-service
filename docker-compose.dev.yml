version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tiktok_sync_postgres
    environment:
      POSTGRES_USER: tiktok_sync
      POSTGRES_PASSWORD: tiktok_sync_secret
      POSTGRES_DB: tiktok_sync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiktok_sync -d tiktok_sync_db"]
      interval: 5s
      timeout: 5s
      retries: 

  redis:
    image: redis:7-alpine
    container_name: tiktok_sync_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ngrok:
    image: ngrok/ngrok:latest
    container_name: tiktok_sync_ngrok
    restart: unless-stopped
    command:
      - "http"
      - "host.docker.internal:8000"
      - "--log=stdout"
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
